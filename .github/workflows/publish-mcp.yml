name: Publish to MCP Registry

on:
  push:
    tags: ["v*"] 
  workflow_dispatch: 

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Sync version in server.json with package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Syncing version to: $VERSION"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > tmp.json && mv tmp.json server.json
          echo "Updated server.json:"
          cat server.json

      - name: Install MCP Publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Login to MCP Registry
        run: ./mcp-publisher login github-oidc

      # release.yml publishes to npm in parallel; the registry rejects the
      # version until npm has it, so retry only on that error
      - name: Publish to MCP Registry
        run: |
          set -o pipefail
          for i in $(seq 1 20); do
            if ./mcp-publisher publish 2>&1 | tee publish.log; then
              exit 0
            fi
            grep -q "was not found" publish.log || exit 1
            echo "npm does not have this version yet, retry $i/20 in 30s"
            sleep 30
          done
          exit 1
